<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Steam Cosmos — Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg">
  <div class="container">
    <h1 class="logo">Steam <span class="accent">Cosmos</span></h1>
    <p class="lead">Secure 24/7 farming. Register and add your Steam accounts.</p>

    <div class="card auth">
      <div id="auth-forms">
        <div class="tabs">
          <button onclick="showLogin()">Войти</button>
          <button onclick="showRegister()">Регистрация</button>
        </div>
        <div id="login-form">
          <input id="l_user" placeholder="Логин">
          <input id="l_pass" type="password" placeholder="Пароль">
          <button class="btn" onclick="login()">Войти</button>
        </div>
        <div id="register-form" style="display:none">
          <input id="r_user" placeholder="Логин">
          <input id="r_pass" type="password" placeholder="Пароль">
          <button class="btn" onclick="register()">Зарегистрироваться</button>
        </div>
      </div>
    </div>

    <p class="muted">После входа вы попадёте в панель управления — фиолетовая космическая тема гарантирована ✨</p>
  </div>
<script src="/app.js"></script>
</body>
</html>
